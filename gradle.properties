# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Same toolchain as Chysalis (https://fabricmc.net/develop for 26.3).
# Minecraft 26.x is unobfuscated: no mappings line is needed (Mojang names are used directly).
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.17-SNAPSHOT

# Mod properties
mod_version=0.1.3
maven_group=dev.chysalis.propagate
archives_base_name=propagate

fabric_api_version=0.163.0+26.3
junit_version=5.13.4

# Chysalis release jar in libs/ (compile only, for the optional API integration)
chysalis_version=0.3.1
