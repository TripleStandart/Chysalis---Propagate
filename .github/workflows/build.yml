name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# A push to main whose mod_version has no release yet publishes the jar as release v<mod_version>.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # The wrapper jar is not committed, so CI uses a pinned Gradle directly.
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build
        run: gradle build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: propagate-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Publish release for a new mod_version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump mod_version to publish a new one."
            exit 0
          fi
          jars=$(ls build/libs/*.jar | grep -v -- '-sources\.jar$')
          gh release create "$tag" $jars --target "$GITHUB_SHA" --title "Propagate $tag" --generate-notes
