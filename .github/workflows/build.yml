name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# A push to main whose mod_version has no release yet publishes the jar as release v<mod_version>.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # The wrapper jar is not committed, so CI uses a pinned Gradle directly.
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build
        run: gradle build --stacktrace

      - name: Game tests (headless server)
        run: gradle runGameTest --stacktrace

      # Client game test under a virtual display: builds a scene and takes screenshots (uploaded below).
      - name: Client game test (screenshots)
        continue-on-error: true
        timeout-minutes: 16
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq > /dev/null || true
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libgles2 mesa-utils > /dev/null || true
          shots() { find . -path '*screenshots/*.png' | grep -q . ; }
          echo "::group::attempt 1: SDL offscreen (EGL, no X server)"
          SDL_VIDEO_DRIVER=offscreen timeout 420 gradle runClientGameTest --stacktrace || true
          echo "::endgroup::"
          if ! shots; then
            echo "::group::attempt 2: Xvfb + EGL"
            SDL_VIDEO_X11_FORCE_EGL=1 timeout 420 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" gradle runClientGameTest --stacktrace || true
            echo "::endgroup::"
          fi
          shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-screenshots
          path: '**/screenshots/*.png'
          if-no-files-found: ignore

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: propagate-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Publish release for a new mod_version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump mod_version to publish a new one."
            exit 0
          fi
          jars=$(ls build/libs/*.jar | grep -v -- '-sources\.jar$')
          gh release create "$tag" $jars --target "$GITHUB_SHA" --title "Propagate $tag" --generate-notes
