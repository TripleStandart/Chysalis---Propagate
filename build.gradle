plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

loom {
	// Client-only code (model wrapper, block entity / particle offsets, config sync) lives in src/client.
	splitEnvironmentSourceSets()

	mods {
		"propagate" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Server game tests (src/gametest): real placement on a headless server, run by CI with "gradle runGameTest".
// Vanilla slabs stand in for chiseled blocks there (Propagate measures any shape the same way).
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "propagate-gametest"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Propagate talks to Chysalis only through block ids, tags and block shapes, so it needs no
	// compile dependency on it. The geometry core (dev.chysalis.propagate.geom) is plain Java and unit-tested.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
